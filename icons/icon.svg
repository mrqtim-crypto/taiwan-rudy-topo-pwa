<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141E18"/>
      <stop offset="100%" stop-color="#0A0F0C"/>
    </linearGradient>
    <linearGradient id="mountainFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>
    <linearGradient id="mountainBack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded box -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" stroke="#22C55E" stroke-opacity="0.3" stroke-width="4"/>

  <!-- Contour lines background effect -->
  <g opacity="0.18" stroke="#22C55E" stroke-width="2" fill="none">
    <ellipse cx="256" cy="310" rx="220" ry="140" />
    <ellipse cx="256" cy="305" rx="170" ry="105" />
    <ellipse cx="256" cy="300" rx="120" ry="75" />
    <ellipse cx="256" cy="295" rx="70" ry="40" />
  </g>

  <!-- Back Mountain -->
  <polygon points="120,410 270,160 410,410" fill="url(#mountainBack)" opacity="0.8"/>
  <polygon points="270,160 300,210 280,240 270,230 250,260 270,160" fill="#60A5FA" opacity="0.4"/>

  <!-- Front Mountain -->
  <polygon points="60,430 190,210 350,430" fill="url(#mountainFront)"/>
  <polygon points="190,210 220,260 200,290 190,280 170,320 190,210" fill="#86EFAC" opacity="0.6"/>

  <!-- GPS Target Ring on Summit -->
  <circle cx="270" cy="160" r="16" fill="none" stroke="#FACC15" stroke-width="4" filter="url(#glow)"/>
  <circle cx="270" cy="160" r="6" fill="#FACC15"/>

  <!-- Trail path (dashed line) -->
  <path d="M 80,440 Q 150,380 200,340 T 250,220 L 270,160" fill="none" stroke="#FACC15" stroke-width="4" stroke-dasharray="8,6" stroke-linecap="round"/>

  <!-- Taiwan Rudy TOPO Text Badge -->
  <rect x="96" y="420" width="320" height="52" rx="26" fill="#111827" stroke="#22C55E" stroke-width="2"/>
  <text x="256" y="454" fill="#F9FAFB" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" letter-spacing="2">
    TAIWAN RUDY TOPO
  </text>
</svg>
